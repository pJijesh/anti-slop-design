name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Generated files are current
        run: node scripts/build.mjs --check
      - name: Run tests
        run: node --test
      - name: Lint the crafted example
        run: node skills/anti-slop-design/scripts/tells.mjs examples/after.html
      - name: Install dry run for every agent
        run: node scripts/install.mjs all --dry-run
